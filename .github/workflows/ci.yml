name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/cache@v6
        id: cargo
        with:
          path: ~/.cargo/bin/shellharden
          key: shellharden-${{ runner.os }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats fd-find ugrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          sudo gem install bashly --no-document
          if [ ! -x ~/.cargo/bin/shellharden ]; then cargo install shellharden --locked; fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: shfmt, shellharden, shellcheck
        run: just lint

      - name: bats
        run: just test
