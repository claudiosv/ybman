name: ci

on:
  # main is checked by release.yml (which calls this workflow); avoid running twice.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: ./.github/actions/setup-bashly

      - name: Cache shellharden
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/shellharden
          key: shellharden-${{ runner.os }}-v1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats fd-find ugrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          [ -x ~/.cargo/bin/shellharden ] || cargo install shellharden --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: shfmt, shellharden, shellcheck
        run: just lint

      - name: bats
        run: just test
