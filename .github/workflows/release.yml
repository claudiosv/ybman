name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bashly

      - name: Build
        run: |
          bashly generate
          chmod +x ybman.sh
          sha256sum ybman.sh > ybman.sh.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: *//p' src/bashly.yml | head -n1)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" ybman.sh ybman.sh.sha256 \
            --target "$GITHUB_SHA" \
            --title "ybman ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
